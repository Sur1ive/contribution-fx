name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          outputs: |
            dist/gravity.svg
            dist/life-dark.svg?theme=life&mode=dark&palette=ocean&label=true
      - run: test -s dist/gravity.svg && test -s dist/life-dark.svg
