# Dogfooding: renders the repository owner's real graph in every theme
# and publishes the files to the `output` branch, exactly like users do.
name: demo

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'action.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          outputs: |
            dist/gravity.svg?theme=gravity
            dist/gravity-dark.svg?theme=gravity&mode=dark
            dist/life.svg?theme=life
            dist/life-dark.svg?theme=life&mode=dark
            dist/sort.svg?theme=sort
            dist/sort-dark.svg?theme=sort&mode=dark
            dist/ripple.svg?theme=ripple
            dist/ripple-dark.svg?theme=ripple&mode=dark
            dist/fireworks.svg?theme=fireworks
            dist/fireworks-dark.svg?theme=fireworks&mode=dark
            dist/equalizer.svg?theme=equalizer
            dist/equalizer-dark.svg?theme=equalizer&mode=dark
            dist/splitflap.svg?theme=splitflap
            dist/splitflap-dark.svg?theme=splitflap&mode=dark
            dist/neon.svg?theme=neon
            dist/neon-dark.svg?theme=neon&mode=dark
            dist/replay.svg?theme=replay
            dist/replay-dark.svg?theme=replay&mode=dark
            dist/constellation.svg?theme=constellation
            dist/constellation-dark.svg?theme=constellation&mode=dark
            dist/circuit.svg?theme=circuit
            dist/circuit-dark.svg?theme=circuit&mode=dark
            dist/warp.svg?theme=warp
            dist/warp-dark.svg?theme=warp&mode=dark
            dist/railgun.svg?theme=railgun
            dist/railgun-dark.svg?theme=railgun&mode=dark
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
